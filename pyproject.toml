[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-search-rag"
version = "0.1.0"
description = "A production-oriented hybrid retrieval RAG pipeline in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "PyMuPDF>=1.24",
    "sentence-transformers>=2.7",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
